<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materiais Didáticos - Escola para Todos</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/acessibilidade.css">
    <style>
        .grade-materiais { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 30px; }
        @media (min-width: 768px) { .grade-materiais { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); } }
        .card-material { background-color: var(--cor-superficie); border: 3px solid transparent; border-radius: 12px; padding: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
        body.high-contrast .card-material { border-color: var(--cor-secundaria); background-color: var(--cor-fundo); }
        .tag-disciplina { display: inline-block; background-color: #E3F2FD; color: var(--cor-primaria); font-size: 0.85rem; font-weight: bold; padding: 4px 10px; border-radius: 4px; margin-bottom: 12px; text-transform: uppercase; }
        body.high-contrast .tag-disciplina { background-color: #121212; color: #FFFFFF; border: 1px solid #FFFFFF; }
        .btn-ler-descricao { background-color: #ECEFF1; color: #1A237E; border: 2px solid #CFD8DC; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px; display: inline-flex; align-items: center; gap: 5px; }
        body.high-contrast .btn-ler-descricao { background-color: #000000; color: #FFFFFF; border-color: #FFFFFF; }
    </style>
</head>
<body>

    <a href="#lista-publica-materiais" class="sr-only-focusable">Pular para a lista de materiais</a>

    <header>
        <h1>Escola para Todos</h1>
        <p class="subtitulo">Central de Materiais Didáticos Acessíveis</p>
    </header>

    <main class="container" style="margin-top: 40px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="color: var(--cor-primaria);">📚 Conteúdos Disponíveis</h2>
            <button class="btn-opcao" style="padding: 10px 15px; font-size: 0.9rem;" onclick="location.href='../index.html'">Voltar ao Início</button>
        </div>

        <div id="lista-publica-materiais" class="grade-materiais" aria-live="polite">
            <!-- Renderizado dinamicamente via API -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Escola para Todos. Inclusão Escolar.</p>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/acessibilidade.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const container = document.getElementById("lista-publica-materiais");
            try {
                const resposta = await fetch("http://localhost:3000/api/materiais");
                if (!resposta.ok) throw new Error();
                const materiais = await resposta.json();

                if (materiais.length === 0) {
                    container.innerHTML = "<p>Nenhum material compartilhado até o momento.</p>";
                    return;
                }

                container.innerHTML = materiais.map(mat => `
                    <article class="card-material" aria-labelledby="tit-${mat.id}">
                        <div>
                            <span class="tag-disciplina">${mat.disciplina}</span>
                            <h3 id="tit-${mat.id}" style="font-size: 1.3rem; margin-bottom: 10px;">${mat.nome}</h3>
                            <div id="desc-${mat.id}" style="display:none;">
                                Material de ${mat.disciplina}: ${mat.nome}. Descrição alternativa: ${mat.descricao_acessivel}
                            </div>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 10px;">
                            <button class="btn-ler-descricao" onclick="ouvirDescricao('desc-${mat.id}')">
                                🔊 Ouvir Descrição do Conteúdo
                            </button>
                            <a href="${mat.url}" target="_blank" class="card-link btn-padrao" style="min-height: auto; padding: 12px; font-size: 1rem; text-align: center; text-decoration: none;">
                                Acessar Conteúdo
                            </a>
                        </div>
                    </article>
                `).join('');
            } catch (erro) {
                container.innerHTML = "<p style='color:var(--cor-alerta);'>Erro ao carregar materiais do servidor.</p>";
            }
        });

        function ouvirDescricao(idElemento) {
            const texto = document.getElementById(idElemento)?.innerText;
            if (texto && window.speechSynthesis) {
                window.speechSynthesis.cancel();
                const enunciado = new SpeechSynthesisUtterance(texto);
                enunciado.lang = 'pt-BR';
                window.speechSynthesis.speak(enunciado);
            }
        }
    </script>
</body>
</html>
