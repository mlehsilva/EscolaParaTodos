<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Avisos - Escola para Todos</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/acessibilidade.css">
    <link rel="stylesheet" href="../css/responsivo.css">
    <style>
        .grade-avisos { display: grid; grid-template-columns: 1fr; gap: 25px; margin-top: 30px; }
        .card-aviso { background-color: var(--cor-superficie); border: 3px solid transparent; border-radius: 12px; padding: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        body.high-contrast .card-aviso { border-color: var(--cor-secundaria); background-color: var(--cor-fundo); }
        .tag-aviso { display: inline-block; background-color: #ECEFF1; color: var(--cor-texto); font-size: 0.85rem; font-weight: bold; padding: 4px 10px; border-radius: 4px; margin-bottom: 10px; text-transform: uppercase; }
        .tag-importante { background-color: #FFEBEE; color: var(--cor-alerta); }
        body.high-contrast .tag-importante { background-color: #000000; color: var(--cor-alerta); border: 1px solid var(--cor-alerta); }
        .meta-aviso { margin: 15px 0; font-size: 0.95rem; color: #616161; }
        body.high-contrast .meta-aviso { color: #FFFFFF; }
        .btn-ouvir { background-color: #ECEFF1; color: #1A237E; border: 2px solid #CFD8DC; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 15px; display: inline-flex; align-items: center; gap: 5px; }
        body.high-contrast .btn-ouvir { background-color: #000000; color: #FFFFFF; border-color: #FFFFFF; }
        body.high-contrast .btn-ouvir:focus-visible { background-color: var(--cor-secundaria); color: #000000; }
    </style>
</head>
<body>

    <a href="#container-mural" class="sr-only-focusable">Saltar para o mural de avisos</a>

    <header>
        <h1>Mural de Avisos</h1>
        <p class="subtitulo">Fique por dentro dos comunicados e eventos da nossa escola.</p>
    </header>

    <main class="container" style="margin-top: 40px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="color: var(--cor-primaria);">📢 Comunicados Recentes</h2>
            <button class="btn-opcao" style="padding: 10px 15px; font-size: 0.9rem;" onclick="location.href='../index.html'">⬅ Voltar ao Início</button>
        </div>

        <div id="container-mural" class="grade-avisos" aria-live="polite">
            <!-- Renderizado dinamicamente via API -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Escola para Todos. Projeto de Inclusão Escolar.</p>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/acessibilidade.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const mural = document.getElementById("container-mural");
            try {
                const resposta = await fetch("http://localhost:3000/api/avisos");
                if (!resposta.ok) throw new Error();
                const avisos = await resposta.json();

                if (avisos.length === 0) {
                    mural.innerHTML = "<p>Nenhum comunicado ativo no momento.</p>";
                    return;
                }

                mural.innerHTML = avisos.map(aviso => {
                    const dataFormatada = new Date(aviso.data_postagem).toLocaleDateString('pt-BR');
                    return `
                        <article class="card-aviso" aria-labelledby="tit-${aviso.id}">
                            <span class="tag-aviso tag-importante">📢 Comunicado</span>
                            <h3 id="tit-${aviso.id}" style="font-size: 1.6rem; margin-bottom: 5px;">${aviso.titulo}</h3>
                            <button class="btn-ouvir" onclick="ouvirTexto('texto-${aviso.id}')">🔊 Ouvir Aviso</button>
                            <div id="texto-${aviso.id}">
                                <p class="meta-aviso">📅 Publicado em: ${dataFormatada}</p>
                                <p>${aviso.conteudo}</p>
                            </div>
                        </article>
                    `;
                }).join('');
            } catch (erro) {
                mural.innerHTML = "<p style='color:var(--cor-alerta);'>Erro ao carregar avisos do servidor.</p>";
            }
        });

        function ouvirTexto(idElemento) {
            const containerTexto = document.getElementById(idElemento);
            if (containerTexto && window.speechSynthesis) {
                window.speechSynthesis.cancel();
                const enunciado = new SpeechSynthesisUtterance(containerTexto.innerText);
                enunciado.lang = 'pt-BR';
                window.speechSynthesis.speak(enunciado);
            }
        }
    </script>
</body>
</html>
